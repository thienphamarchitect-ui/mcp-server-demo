:root{--cy:#05F4E8;--navy:#06121C;--y:#FFE600}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--navy);font-family:SS,sans-serif}
#stage{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;will-change:transform,opacity}
.grade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,10,18,.86) 0%,rgba(3,10,18,.35) 30%,rgba(3,10,18,.25) 52%,rgba(3,10,18,.85) 78%,rgba(3,10,18,.95) 100%)}
.dark{position:absolute;inset:0;background:radial-gradient(1200px 900px at 70% 20%,#0E3346 0%,#081A26 45%,#050E16 100%)}
.grid{position:absolute;inset:-200px;background-image:linear-gradient(rgba(5,244,232,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(5,244,232,.07) 2px,transparent 2px);background-size:90px 90px}
.line{position:absolute;left:0;width:1080px;text-align:center;font-weight:900;text-transform:uppercase;white-space:nowrap;transform-origin:50% 50%}
.line span{display:inline-block;transform:scaleX(.86)}
.w{color:#fff;text-shadow:0 0 18px rgba(0,0,0,.75),0 0 4px rgba(0,0,0,.9),0 6px 30px rgba(0,0,0,.6)}
.c{color:var(--cy);text-shadow:0 0 22px rgba(5,244,232,.55),0 0 4px rgba(0,0,0,.9),0 6px 30px rgba(0,0,0,.65)}
.r{color:#FF4D5E;text-shadow:0 0 22px rgba(255,77,94,.5),0 0 4px rgba(0,0,0,.9)}
.paper{position:absolute;left:50%;background:#fff;border-radius:22px;padding:18px;box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 3px rgba(5,244,232,.0);transform-origin:50% 50%}
.paper img{display:block;width:100%;border-radius:10px}
.tag{position:absolute;left:28px;top:-34px;background:#E3172F;color:#fff;font-weight:900;font-size:34px;padding:8px 22px;border-radius:12px;letter-spacing:.5px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.tag.dark2{background:#0B0F14;border:3px solid var(--cy);color:var(--cy)}
.chip{position:absolute;left:90px;height:116px;display:flex;align-items:center;gap:26px;padding:0 40px 0 26px;border-radius:60px;background:rgba(6,18,28,.72);border:3px solid rgba(5,244,232,.8);box-shadow:0 0 40px rgba(5,244,232,.25);color:#fff;font-weight:900;font-size:58px;text-transform:uppercase}
.chip .ic{width:70px;height:70px;border-radius:50%;background:var(--cy);color:#06121C;display:flex;align-items:center;justify-content:center;font-size:44px}
.src{position:absolute;left:0;width:1080px;text-align:center;color:rgba(255,255,255,.75);font-weight:600;font-size:30px;letter-spacing:1px}
#brand{position:absolute;left:54px;top:70px;display:flex;align-items:center;gap:18px}
#brand .bar{width:12px;height:64px;background:var(--cy);border-radius:4px;box-shadow:0 0 20px var(--cy)}
#brand .t1{color:#fff;font-weight:900;font-size:44px;line-height:1}
#brand .t2{color:var(--cy);font-weight:700;font-size:26px;letter-spacing:3px;margin-top:6px}
#loc{position:absolute;right:54px;top:84px;color:#fff;font-weight:700;font-size:28px;letter-spacing:3px;padding:10px 20px;border:2px solid rgba(255,255,255,.5);border-radius:40px}
#prog{position:absolute;left:0;top:0;height:8px;background:var(--cy);box-shadow:0 0 16px var(--cy)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#leak{position:absolute;inset:-200px;opacity:0;background:radial-gradient(700px 600px at 20% 30%,rgba(255,170,80,.9),transparent 60%),radial-gradient(800px 700px at 90% 80%,rgba(255,90,60,.7),transparent 60%);mix-blend-mode:screen}
#glow{position:absolute;inset:0;opacity:0;background:radial-gradient(800px 600px at 50% 40%,rgba(5,244,232,.55),transparent 70%);mix-blend-mode:screen}
#sweep{position:absolute;top:-400px;width:260px;height:2800px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transform:rotate(18deg);opacity:0}
#vign{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
.cta{position:absolute;left:50%;width:820px;height:170px;margin-left:-410px;border-radius:90px;background:var(--cy);display:flex;align-items:center;justify-content:center;gap:28px;color:#06121C;font-weight:900;font-size:66px;box-shadow:0 0 60px rgba(5,244,232,.6),0 20px 50px rgba(0,0,0,.5)}
.disc{position:absolute;left:60px;right:60px;bottom:120px;text-align:center;color:rgba(255,255,255,.7);font-weight:600;font-size:27px;line-height:1.35}
.dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--cy);opacity:.5}
</style></head>

<script>
const W=1080,H=1920;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3);
const eExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const eBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const SFX=[]; const sfx=(t,name,g=0)=>SFX.push({t:+t.toFixed(3),name,g});

/* ---------- MAP (sơ đồ minh hoạ) ---------- */

 ${[0,1,2,3,4].map(i=>`<path d="M${560+i*60},420 C${600+i*60},560 ${560+i*60},700 ${700+i*60},800 S${760+i*60},1100 ${880+i*60},1500" stroke="rgba(5,244,232,${.10-i*.015})" stroke-width="3" fill="none"/>`).join('')}
 <path d="M-400,430 L470,430 C520,500 430,580 520,650 C600,720 640,760 610,820 L640,800 C700,740 820,700 860,740 C905,785 820,840 700,850 C660,870 650,910 665,960 L725,1140 L805,1320 L870,1700 L-400,1700 Z" fill="url(#land)" stroke="rgba(5,244,232,.85)" stroke-width="5" filter="url(#gl)"/>

   <circle class="ring" r="40" fill="none" stroke="#05F4E8" stroke-width="5"/>
   <circle class="core" r="22" fill="#05F4E8" filter="url(#gl)"/>
   <text class="num" y="9" text-anchor="middle" fill="#06121C" font-family="SS" font-weight="900" font-size="28">${k}</text>
   <g class="lab"><rect x="${k==1||k==4||k==2?-470:46}" y="-30" rx="14" width="${l.length*21+40}" height="60" fill="rgba(6,18,28,.85)" stroke="#05F4E8" stroke-width="3"/>
   <text x="${(k==1||k==4||k==2?-470:46)+20}" y="12" fill="#fff" font-family="SS" font-weight="900" font-size="32">${l}</text></g></g>`).join('')}
 </g>
 <text x="540" y="1640" text-anchor="middle" fill="rgba(255,255,255,.45)" font-family="SS" font-weight="600" font-size="26">Sơ đồ minh hoạ, không theo tỷ lệ</text>
</svg>`;
// fix label widths for pins that sit on the right side: shift labels to left
for(const k of [1,2,4]){const g=document.querySelector(`#pin${k} .lab`);const r=g.querySelector('rect');const w=+r.getAttribute('width');r.setAttribute('x',-w-46);g.querySelector('text').setAttribute('x',-w-46+20);}

// map camera keyframes [t, cx, cy, scale]
const CAM=[[10.6,540,1000,1],[11.4,720,1180,1.12],[13,720,1180,1.16],[15.8,560,1000,1.0],[16.6,620,920,1.15],[17.1,620,920,1.18],[20.4,540,1000,1.0],[21.2,420,760,1.15],[22.0,420,760,1.18],
 [26.1,540,1000,0.95],[28.9,540,1000,1.02],[29.13,640,1060,1.2],[33.6,640,1060,1.28]];
function cam(t){let a=CAM[0],b=CAM[CAM.length-1];for(let i=0;i<CAM.length-1;i++){if(t>=CAM[i][0]&&t<=CAM[i+1][0]){a=CAM[i];b=CAM[i+1];break;}}
 if(t<CAM[0][0])return CAM[0]; if(t>b[0])return b; const k=eIO(lin(t,a[0],b[0]));
 if(b[0]-a[0]<0.05) return b; return [t,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k,a[3]+(b[3]-a[3])*k];}
const PINACT={1:[10.9,16],2:[15.9,20.6],3:[20.5,26.2],4:[29.13,40]};

/* ---------- BACKGROUNDS ---------- */
const bgEls=TL.bgs.map(([src,i,o,dir])=>{let el;
  if(src==='DARK'){el=document.createElement('div');el.className='bg';el.innerHTML='<div class="dark"></div><div class="grid"></div>';}
  else if(src==='MAP'){el=null;}
  else{el=document.createElement('div');el.className='bg';el.style.backgroundImage=`url(${src})`;const g=document.createElement('div');g.className='grade';el.appendChild(g);}
  if(el)document.getElementById('bgs').appendChild(el);return {el,src,i,o,dir};});
// particles for dark scenes
const fx=document.getElementById('fx');const dots=[];
for(let i=0;i<40;i++){const d=document.createElement('div');d.className='dot';fx.appendChild(d);dots.push({d,x:(i*197)%1080,y:(i*331)%1920,s:.3+((i*7)%10)/10,sz:4+(i%4)*3});}

/* ---------- ELEMENTS ---------- */
const E=[]; const els=document.getElementById('els');
function line(text,cls,cap,y,tin,tout,opt={}){const el=document.createElement('div');el.className='line '+cls;const fs=cap/0.66;
 el.style.fontSize=fs+'px';el.style.top=(y-fs*0.27-cap/2)+'px';el.style.height=fs+'px';el.style.lineHeight=fs+'px';
 el.innerHTML=`<span>${text}</span>`;els.appendChild(el);E.push({type:'line',el,tin,tout,anim:opt.anim||'track',count:opt.count,cap,y,fs});
 if(opt.sfx!==false)sfx(tin,opt.sfx||(cls==='c'?'ting':'pop'),opt.g||0);return el;}
function paper(src,tag,y,w,tin,tout,rot=-2,opt={}){const el=document.createElement('div');el.className='paper';el.style.width=w+'px';el.style.marginLeft=(-w/2-18)+'px';el.style.top=y+'px';
 el.innerHTML=`<div class="tag ${opt.dark?'dark2':''}">${tag}</div><img src="${src}">`;els.appendChild(el);E.push({type:'paper',el,tin,tout,rot});sfx(tin,'whoosh',-2);sfx(tin+0.32,'shutter',-3);return el;}
function chip(icon,text,y,tin,tout){const el=document.createElement('div');el.className='chip';el.style.top=y+'px';el.innerHTML=`<div class="ic">${icon}</div><span style="display:inline-block;transform:scaleX(.86);transform-origin:left">${text}</span>`;els.appendChild(el);E.push({type:'chip',el,tin,tout});sfx(tin,'notify',-1);return el;}
function src(text,y,tin,tout){const el=document.createElement('div');el.className='src';el.style.top=y+'px';el.textContent=text;els.appendChild(el);E.push({type:'fade',el,tin,tout});}
function raw(html,tin,tout,type='fade'){const d=document.createElement('div');d.innerHTML=html;const el=d.firstElementChild;els.appendChild(el);E.push({type,el,tin,tout});return el;}

// SCENE 1 – HOOK
line('THỊ TRƯỜNG ĐÀ NẴNG','w',66,420,0.3,2.05,{sfx:'whoosh'});

line('NHƯNG CÓ','w',66,420,2.15,4.4);
line('4 VÙNG','c',190,600,2.35,4.4,{sfx:'impact',g:-2,anim:'hero'});

paper('assets/cafef_head.png','CAFEF · 25/10/2026',640,900,4.7,8.0,-2);

line('-25%','r',190,1530,6.7,8.0,{anim:'count',count:[0,-25,'%'],sfx:'impact',g:-3});
src('Nguồn: DKRA Consulting, báo cáo quý III/2026',1700,5.6,8.0);

sfx(27.6,'heartbeat',-2);sfx(28.4,'heartbeat',-2);sfx(26.9,'riser',-4);

raw(`<div class="cta" style="top:1020px">💬 <span style="display:inline-block;transform:scaleX(.86)">BÌNH LUẬN "REGAL"</span></div>`,50.3,55.6,'pop');sfx(50.3,'pop',0);sfx(50.35,'sparkle',-4);
line('NHẬN BẢNG SO SÁNH DỰ ÁN','w',46,1290,51.6,55.6);
raw(`<div class="disc">Bảng giá đất là giá Nhà nước công bố, không phải giá giao dịch.<br>Nội dung tham khảo, không phải khuyến nghị đầu tư.<br>Nguồn: DKRA, VietnamFinance, Tuổi Trẻ, Dân Trí, CafeLand, Regal Group.</div>`,51.0,55.6);
// transitions SFX
[4.45,10.6,33.3,41.8,48.1].forEach(t=>sfx(t,'whoosh',-3));
sfx(0,'impact',-6);

const FLASH=[[0,0.5,1],[29.13,0.35,0.9],[33.35,0.25,0.5],[48.1,0.25,0.4]];
const GLOW=[[2.35,1.2],[29.13,1.6],[34.3,1.0],[48.95,1.0]];
const SWEEP=[[4.7],[13.0],[17.0],[22.0],[35.2],[42.7]];

window.SFX_LIST=SFX;
function fmtNum(v,suf,plus){const n=Math.round(v);const s=Math.abs(n).toLocaleString('de-DE');return (n<0?'-':(plus&&n>0?'+':''))+s+suf;}
window.fit=function(){for(const e of E){if(e.type!=='line')continue;const el=e.el,sp=el.querySelector('span');el.style.display='';const txt=sp.textContent;if(e.count){sp.textContent=fmtNum(e.count[1],e.count[2],e.count[3]);}const w=sp.getBoundingClientRect().width;sp.textContent=txt;if(w>950){const fs=e.fs*950/w;el.style.fontSize=fs+'px';el.style.height=fs+'px';el.style.lineHeight=fs+'px';el.style.top=(e.y-fs*0.27-fs*0.66/2)+'px';}el.style.display='none';}}

window.render=function(t){
  // backgrounds
  for(const b of bgEls){ if(!b.el)continue; const fi=lin(t,b.i,b.i+0.35), fo=1-lin(t,b.o-0.35,b.o); const op=Math.min(fi,fo);
    b.el.style.opacity=op; if(op<=0){b.el.style.display='none';continue;} b.el.style.display='block';
    const p=lin(t,b.i,b.o); const s=1.08+0.10*p; const dx=b.dir*40*(p-.5);
    b.el.style.transform=`translateX(${dx}px) scale(${s})`;
    const g=b.el.querySelector('.grid'); if(g) g.style.transform=`translateY(${(t*30)%90}px)`; }
  // map
  const mw=document.getElementById('mapwrap'); let mop=0;
  for(const b of bgEls){ if(b.src!=='MAP')continue; mop=Math.max(mop,Math.min(lin(t,b.i,b.i+0.3),1-lin(t,b.o-0.3,b.o))); }
  mw.style.opacity=mop*(t>30.2&&t<33.6?1-0.6*lin(t,30.2,30.7):1);
  if(mop>0){ const [,cx,cy,s]=cam(t); document.getElementById('mapg').setAttribute('transform',`translate(${540-cx*s+ (cx-540)*0} ${1000-cy*s}) scale(${s})`);
    document.getElementById('mgrid').style.transform=`translateY(${(t*30)%90}px)`;
    for(const k of [1,2,3,4]){const g=document.getElementById('pin'+k);const [a,bq]=PINACT[k];const act=t>=a&&t<bq;const visited=t>=bq;
      const pulse=act?(1+0.25*Math.sin((t-a)*8)):1; const ring=g.querySelector('.ring');
      const inA=eBack(lin(t,a,a+0.4));
      ring.setAttribute('r',act?40+((t-a)*60)%60:34); ring.setAttribute('opacity',act?1-((t-a)*60%60)/60:(visited?.6:.25));
      g.querySelector('.core').setAttribute('r',act?22*pulse*(0.6+0.4*inA):(visited?18:14));
      g.querySelector('.core').setAttribute('fill',act||visited?'#05F4E8':'#2D5566');
      const lab=g.querySelector('.lab'); const recap=t>26.1&&t<29.13; lab.setAttribute('opacity',act?inA*(t>30.2?0:1):(visited&&recap?.7:0));
      g.setAttribute('opacity', (k==4&&t>26.1&&t<29.13)? (0.5+0.5*Math.sin(t*10)) : 1); } }
  // particles
  const dop=Math.max(mop, ...bgEls.filter(b=>b.src==='DARK').map(b=>Math.min(lin(t,b.i,b.i+.3),1-lin(t,b.o-.3,b.o))));
  for(const p of dots){p.d.style.opacity=.45*dop; const y=(p.y - t*40*p.s)%1920; p.d.style.transform=`translate(${p.x}px,${y<0?y+1920:y}px)`; p.d.style.width=p.d.style.height=p.sz+'px';}
  // elements
  for(const e of E){ const el=e.el; if(t<e.tin||t>=e.tout+0.2){el.style.display='none';continue;} el.style.display='';
    const k=t-e.tin, ko=lin(t,e.tout-0.12,e.tout); let op=1-ko;
    if(e.type==='line'){ const sp=el.querySelector('span');
      if(e.anim==='track'){const x=eExpo(clamp(k/0.45)); sp.style.letterSpacing=((1-x)*0.55)+'em'; el.style.filter=`blur(${(1-x)*10}px)`; op*=clamp(k/0.15); el.style.transform='';}
      else if(e.anim==='hero'||e.anim==='count'){const x=eExpo(clamp(k/0.35)); el.style.transform=`scale(${1.7-0.7*x})`; el.style.filter=`blur(${(1-x)*8}px)`; op*=clamp(k/0.12); sp.style.letterSpacing='0';
        if(e.count){const [a,b,suf]=e.count; const c=eOut(clamp(k/0.7)); sp.textContent=fmtNum(a+(b-a)*c,suf,e.count[3]);} }
      else if(e.anim==='pulse'){const s=1+0.06*Math.sin(k*9); el.style.transform=`scale(${s})`; op*=clamp(k/0.2)*(0.75+0.25*Math.sin(k*9));}
      el.style.opacity=op; }
    else if(e.type==='paper'){const x=eBack(clamp(k/0.55)); const y=(1-x)*700; const r=e.rot+(1-x)*10; const s=(0.88+0.12*x)*(1+0.03*clamp(k/4));
      const outx=-eIO(ko)*1100; el.style.transform=`translate(${outx}px,${y}px) rotate(${r}deg) scale(${s})`; el.style.opacity=clamp(k/0.15)*(1-ko*0.3);}
    else if(e.type==='chip'){const x=eBack(clamp(k/0.45)); el.style.transform=`translateX(${(1-x)*-500}px)`; el.style.opacity=clamp(k/0.12)*(1-ko);}
    else if(e.type==='pop'){const x=eBack(clamp(k/0.5)); const s=(0.3+0.7*x)*(1+0.03*Math.sin(Math.max(0,k-0.5)*6)); el.style.transform=`scale(${s})`; el.style.opacity=clamp(k/0.1)*(1-ko);}
    else {el.style.opacity=clamp(k/0.3)*(1-ko);}
  }
  // fx
  let fl=0; for(const [a,d,m] of FLASH){ if(t>=a&&t<a+d) fl=Math.max(fl,m*(1-(t-a)/d)); } document.getElementById('flash').style.opacity=fl;
  let gl=0; for(const [a,d] of GLOW){ if(t>=a&&t<a+d) gl=Math.max(gl,Math.sin(Math.PI*(t-a)/d)*0.8);} document.getElementById('glow').style.opacity=gl;
  const sw=document.getElementById('sweep'); let swo=0,swx=-400; for(const [a] of SWEEP){ if(t>=a+0.4&&t<a+1.2){const p=(t-a-0.4)/0.8; swo=Math.sin(Math.PI*p); swx=-300+p*1700;} } sw.style.opacity=swo; sw.style.left=swx+'px';
  const lk=document.getElementById('leak'); const lp=lin(t,54.3,55.6); lk.style.opacity=Math.sin(Math.PI*Math.min(lp*1.4,1))*0.9 + (t>55.2?lin(t,55.2,55.6):0); lk.style.transform=`translateX(${lp*200}px)`;
  document.getElementById('prog').style.width=(t/TL.total*1080)+'px';
  // final fade
  document.getElementById('stage').style.filter = t>55.0? `brightness(${1+lin(t,55.0,55.6)*1.5})`:'';
};
