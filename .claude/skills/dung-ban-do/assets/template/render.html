<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:SS;font-weight:900;src:url(fonts/source-sans-3-vietnamese-900-normal.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:SS;font-weight:900;src:url(fonts/source-sans-3-latin-900-normal.woff2) format('woff2')}
@font-face{font-family:SS;font-weight:700;src:url(fonts/source-sans-3-vietnamese-700-normal.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:SS;font-weight:700;src:url(fonts/source-sans-3-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:SS;font-weight:600;src:url(fonts/source-sans-3-vietnamese-600-normal.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}
@font-face{font-family:SS;font-weight:600;src:url(fonts/source-sans-3-latin-600-normal.woff2) format('woff2')}
:root{--cy:#05F4E8;--navy:#06121C;--y:#FFE600}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--navy);font-family:SS,sans-serif}
#stage{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;will-change:transform,opacity}
.dark{position:absolute;inset:0;background:radial-gradient(1200px 900px at 70% 20%,#0E3346 0%,#081A26 45%,#050E16 100%)}
.grid{position:absolute;inset:-200px;background-image:linear-gradient(rgba(5,244,232,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(5,244,232,.07) 2px,transparent 2px);background-size:90px 90px}
.line{position:absolute;left:0;width:1080px;text-align:center;font-weight:900;text-transform:uppercase;white-space:nowrap;transform-origin:50% 50%}
.line span{display:inline-block;transform:scaleX(.86)}
.w{color:#fff;text-shadow:0 0 18px rgba(0,0,0,.75),0 0 4px rgba(0,0,0,.9),0 6px 30px rgba(0,0,0,.6)}
.c{color:var(--cy);text-shadow:0 0 22px rgba(5,244,232,.55),0 0 4px rgba(0,0,0,.9),0 6px 30px rgba(0,0,0,.65)}
.r{color:#FF4D5E;text-shadow:0 0 22px rgba(255,77,94,.5),0 0 4px rgba(0,0,0,.9)}
.paper{position:absolute;left:50%;background:#fff;border-radius:22px;padding:18px;box-shadow:0 40px 90px rgba(0,0,0,.55);transform-origin:50% 50%}
.paper img{display:block;width:100%;border-radius:10px}
.tag{position:absolute;left:28px;top:-34px;background:#E3172F;color:#fff;font-weight:900;font-size:34px;padding:8px 22px;border-radius:12px;letter-spacing:.5px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.tag.dark2{background:#0B0F14;border:3px solid var(--cy);color:var(--cy)}
.chip{position:absolute;left:90px;height:116px;display:flex;align-items:center;gap:26px;padding:0 40px 0 26px;border-radius:60px;background:rgba(6,18,28,.78);border:3px solid rgba(5,244,232,.8);box-shadow:0 0 40px rgba(5,244,232,.25);color:#fff;font-weight:900;font-size:58px;text-transform:uppercase;white-space:nowrap}
.chip .ic{width:70px;height:70px;border-radius:50%;background:var(--cy);color:#06121C;display:flex;align-items:center;justify-content:center;font-size:44px}
.src{position:absolute;left:0;width:1080px;text-align:center;color:rgba(255,255,255,.8);font-weight:600;font-size:30px;letter-spacing:1px;text-shadow:0 2px 10px #000}
.note{position:absolute;left:0;width:1080px;text-align:center;color:#fff;font-weight:700;font-size:28px;letter-spacing:.5px;text-shadow:0 2px 12px #000,0 0 4px #000}
#brand{position:absolute;left:54px;top:70px;display:flex;align-items:center;gap:18px}
#brand .bar{width:12px;height:64px;background:var(--cy);border-radius:4px;box-shadow:0 0 20px var(--cy)}
#brand .t1{color:#fff;font-weight:900;font-size:44px;line-height:1;text-shadow:0 2px 12px #000}
#brand .t2{color:var(--cy);font-weight:700;font-size:24px;letter-spacing:2px;margin-top:6px;text-shadow:0 2px 10px #000}
#loc{position:absolute;right:54px;top:84px;color:#fff;font-weight:700;font-size:28px;letter-spacing:3px;padding:10px 20px;border:2px solid rgba(255,255,255,.5);border-radius:40px;background:rgba(6,18,28,.4)}
#demo{position:absolute;right:54px;top:150px;color:#FFE600;font-weight:700;font-size:22px;letter-spacing:2px;text-shadow:0 2px 8px #000}
#prog{position:absolute;left:0;top:0;height:8px;background:var(--cy);box-shadow:0 0 16px var(--cy)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#glow{position:absolute;inset:0;opacity:0;background:radial-gradient(800px 600px at 50% 40%,rgba(5,244,232,.55),transparent 70%);mix-blend-mode:screen}
#sweep{position:absolute;top:-400px;width:260px;height:2800px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transform:rotate(18deg);opacity:0}
#vign{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);pointer-events:none}
.cta{position:absolute;left:50%;width:820px;height:170px;margin-left:-410px;border-radius:90px;background:var(--cy);display:flex;align-items:center;justify-content:center;gap:28px;color:#06121C;font-weight:900;font-size:66px;box-shadow:0 0 60px rgba(5,244,232,.6),0 20px 50px rgba(0,0,0,.5)}
.disc{position:absolute;left:50px;right:50px;bottom:100px;text-align:center;color:rgba(255,255,255,.78);font-weight:600;font-size:25px;line-height:1.35;text-shadow:0 2px 8px #000}
.cap{position:absolute;left:70px;right:70px;text-align:center;font-weight:900;line-height:1.12;color:#fff;paint-order:stroke fill;-webkit-text-stroke:10px rgba(0,0,0,.85);text-shadow:0 4px 18px rgba(0,0,0,.55)}
.cap b{color:var(--cy)}
.dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--cy);opacity:.5}
</style></head>
<body><div id="stage">
  <div id="bgs"></div>
  <div id="mapwrap" class="abs" style="inset:0;opacity:0"></div>
  <div id="fx"></div>
  <div id="els"></div>
  <div id="sweep"></div>
  <div id="glow"></div>
  <div id="vign"></div>
  <div id="brand"></div>
  <div id="loc"></div>
  <div id="demo"></div>
  <div id="prog"></div>
  <div id="flash"></div>
</div>
<script src="assets/map_config.js"></script>
<script src="timeline.js"></script>
<script src="engine.js"></script>
<script src="scene.js"></script>
</body></html>
