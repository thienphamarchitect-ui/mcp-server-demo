services:
  mcp-server:
    build: .
    image: demo-mcp-server:latest
    ports:
      - "8000:8000"
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "8000"
      # Đặt API key thật khi deploy (ví dụ: openssl rand -hex 32).
      # Để trống/bỏ dòng này = chạy KHÔNG có auth.
      MCP_API_KEY: ${MCP_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./files:/app/files
    restart: unless-stopped
